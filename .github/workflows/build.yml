# this can and should be optimized, the setup steps can be cached in docker,
# and that should be broken out, annoyingly, though, I can't do that with
# proper interjob dependency tracking without exposing tokens to third parties
# possibly
name: build

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'devuan/devuan:daedalus'
          - 'devuan/devuan:excalibur'
          - 'devuan/devuan:ceres'
          - 'alpine:3.21'
          - 'alpine:latest'
          - 'alpine:edge'
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: install prerequisites (alpine)
        if: ${{ startsWith(matrix.distro, 'alpine:') }}
        run: >-
          apk --no-cache add \
            build-base \
            gperf \
            glib-dev \
            linux-headers \
            kmod-dev \
            gobject-introspection-dev \
            util-linux-dev \
            perl \
            autoconf \
            libxslt \
            automake \
            tree

      # libselinux 3.11 renamed libselinux1-dev to libselinux-dev, so let
      # apt pick whichever one the release has
      - name: install prerequisites (devuan)
        if: ${{ startsWith(matrix.distro, 'devuan/') }}
        run: >-
          apt-get update && apt-get satisfy -y \
            "build-essential, \
            libblkid-dev, \
            libkmod-dev, \
            libselinux-dev | libselinux1-dev, \
            autoconf, \
            automake, \
            xsltproc, \
            docbook-xml, \
            docbook-xsl, \
            gperf, \
            libglib-object-introspection-perl, \
            libglib2.0-dev, \
            linux-headers-amd64, \
            libtool, \
            tree"

      - name: checkout
        uses: actions/checkout@v7
      - name: generate configure script
        run: ./autogen.sh
      - name: configure
        run: ./configure
      - name: make
        run: make -j$(($(nproc)+1))
      - name: check
        run: make check || cat test/udev-test.pl.log
